<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Gradient descent moving a weight across two update steps</title>
<desc>A loss curve versus weight value, with a point starting far up the slope moving closer to the minimum after each gradient descent step, taking smaller steps as the slope flattens</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="60" y="70" font-family="sans-serif" font-size="12" fill="#5F5E5A">loss L(w)</text>
<path d="M60,110 C220,330 460,330 620,110" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>

<line x1="140" y1="194" x2="225" y2="249" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="225" y1="249" x2="300" y2="271" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

<circle cx="140" cy="194" r="7" fill="#993C1D"/>
<circle cx="225" cy="249" r="7" fill="#993C1D"/>
<circle cx="300" cy="271" r="7" fill="#993C1D"/>

<g font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">
<text x="140" y="175">w0 (start)</text>
<text x="225" y="230">w1</text>
<text x="300" y="252">w2</text>
</g>

<text x="340" y="355" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">weight value w</text>
<text x="340" y="45" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">step 1 &#8776; large (steep slope) &#8594; step 2 &#8776; smaller (flatter slope)</text>
</svg>
