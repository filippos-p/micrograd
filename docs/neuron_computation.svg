<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Single neuron: weighted sum passed through tanh</title>
<desc>Three inputs x1,x2,x3 with weights w1,w2,w3 and a bias b feed a summation node, whose output passes through a tanh activation to produce the neuron's output</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<line x1="94" y1="70" x2="280" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="94" y1="150" x2="280" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="94" y1="230" x2="280" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<g font-family="sans-serif" font-size="12" fill="#5F5E5A">
<text x="187" y="103">w1</text><text x="187" y="140">w2</text><text x="187" y="197">w3</text>
</g>

<line x1="300" y1="210" x2="300" y2="172" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text x="315" y="200" font-family="sans-serif" font-size="12" fill="#5F5E5A">b</text>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<circle cx="80" cy="70" r="14"/><circle cx="80" cy="150" r="14"/><circle cx="80" cy="230" r="14"/>
</g>
<g font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">
<text x="80" y="70">x1</text><text x="80" y="150">x2</text><text x="80" y="230">x3</text>
</g>

<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"><circle cx="300" cy="150" r="20"/></g>
<text x="300" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">&#931;</text>

<line x1="320" y1="150" x2="378" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<g fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"><rect x="380" y="110" width="110" height="80" rx="8"/></g>
<path d="M392,175 C410,175 420,150 435,150 C450,150 460,125 478,125" fill="none" stroke="#712B13" stroke-width="1.5"/>
<text x="435" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">tanh</text>

<line x1="492" y1="150" x2="573" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"><circle cx="590" cy="150" r="15"/></g>
<text x="590" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#04342C">o</text>

<text x="435" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">act = w1&#183;x1 + w2&#183;x2 + w3&#183;x3 + b</text>
</svg>
