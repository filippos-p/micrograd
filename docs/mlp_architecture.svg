<svg width="100%" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>MLP architecture with 3 inputs, two hidden layers of 4, and 1 output</title>
<desc>Diagram of a multilayer perceptron showing the forward pass (input to output) and backward pass (gradients flowing output to input)</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="360" y="45" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">forward pass &#8212; computes predictions</text>
<line x1="100" y1="62" x2="620" y2="62" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

<g stroke="#888780" stroke-width="0.5" opacity="0.4">
<line x1="140" y1="160" x2="290" y2="145"/><line x1="140" y1="160" x2="290" y2="215"/><line x1="140" y1="160" x2="290" y2="285"/><line x1="140" y1="160" x2="290" y2="355"/>
<line x1="140" y1="250" x2="290" y2="145"/><line x1="140" y1="250" x2="290" y2="215"/><line x1="140" y1="250" x2="290" y2="285"/><line x1="140" y1="250" x2="290" y2="355"/>
<line x1="140" y1="340" x2="290" y2="145"/><line x1="140" y1="340" x2="290" y2="215"/><line x1="140" y1="340" x2="290" y2="285"/><line x1="140" y1="340" x2="290" y2="355"/>
<line x1="290" y1="145" x2="440" y2="145"/><line x1="290" y1="145" x2="440" y2="215"/><line x1="290" y1="145" x2="440" y2="285"/><line x1="290" y1="145" x2="440" y2="355"/>
<line x1="290" y1="215" x2="440" y2="145"/><line x1="290" y1="215" x2="440" y2="215"/><line x1="290" y1="215" x2="440" y2="285"/><line x1="290" y1="215" x2="440" y2="355"/>
<line x1="290" y1="285" x2="440" y2="145"/><line x1="290" y1="285" x2="440" y2="215"/><line x1="290" y1="285" x2="440" y2="285"/><line x1="290" y1="285" x2="440" y2="355"/>
<line x1="290" y1="355" x2="440" y2="145"/><line x1="290" y1="355" x2="440" y2="215"/><line x1="290" y1="355" x2="440" y2="285"/><line x1="290" y1="355" x2="440" y2="355"/>
<line x1="440" y1="145" x2="590" y2="250"/><line x1="440" y1="215" x2="590" y2="250"/><line x1="440" y1="285" x2="590" y2="250"/><line x1="440" y1="355" x2="590" y2="250"/>
</g>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<circle cx="140" cy="160" r="15"/><circle cx="140" cy="250" r="15"/><circle cx="140" cy="340" r="15"/>
</g>
<g font-family="sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">
<text x="140" y="160">x1</text><text x="140" y="250">x2</text><text x="140" y="340">x3</text>
</g>

<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5">
<circle cx="290" cy="145" r="15"/><circle cx="290" cy="215" r="15"/><circle cx="290" cy="285" r="15"/><circle cx="290" cy="355" r="15"/>
<circle cx="440" cy="145" r="15"/><circle cx="440" cy="215" r="15"/><circle cx="440" cy="285" r="15"/><circle cx="440" cy="355" r="15"/>
</g>

<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"><circle cx="590" cy="250" r="15"/></g>
<text x="590" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#04342C">o</text>

<g font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">
<text x="140" y="398">Input (3)</text>
<text x="290" y="398">Hidden (4)</text>
<text x="440" y="398">Hidden (4)</text>
<text x="590" y="398">Output (1)</text>
</g>

<line x1="620" y1="440" x2="100" y2="440" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="425" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">backward pass &#8212; gradients flow output to input (chain rule)</text>
</svg>
