<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How a rank-1 map from R2 to R1 collapses whole lines of points onto a single output</title>
<desc>Input space R2 with four parallel lines (level sets of f); points on the same line all map to the same single point in the output space R1. One line, through the origin, is the kernel (f=0).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="180" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">input space (R&#178;) &#8212; samples x</text>
<rect x="60" y="40" width="240" height="340" fill="none" stroke="#888780" stroke-width="1"/>
<line x1="60" y1="60" x2="300" y2="300" stroke="#D85A30" stroke-width="2"/>
<circle cx="100" cy="100" r="6" fill="#993C1D"/><circle cx="240" cy="240" r="6" fill="#993C1D"/>
<text x="60" y="52" font-family="sans-serif" font-size="12" fill="#993C1D">kernel (f=0)</text>
<line x1="60" y1="140" x2="300" y2="380" stroke="#534AB7" stroke-width="2"/>
<circle cx="90" cy="170" r="6" fill="#26215C"/><circle cx="260" cy="340" r="6" fill="#26215C"/>
<line x1="60" y1="220" x2="220" y2="380" stroke="#0F6E56" stroke-width="2"/>
<circle cx="80" cy="240" r="6" fill="#04342C"/><circle cx="180" cy="340" r="6" fill="#04342C"/>
<line x1="60" y1="300" x2="140" y2="380" stroke="#9A6400" stroke-width="2"/>
<circle cx="65" cy="305" r="6" fill="#6B4700"/><circle cx="120" cy="360" r="6" fill="#6B4700"/>
<text x="340" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">f</text>
<line x1="310" y1="215" x2="490" y2="215" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">output space (R&#185;)</text>
<line x1="520" y1="60" x2="520" y2="380" stroke="#888780" stroke-width="1"/>
<circle cx="520" cy="100" r="7" fill="#993C1D"/>
<circle cx="520" cy="180" r="7" fill="#26215C"/>
<circle cx="520" cy="260" r="7" fill="#04342C"/>
<circle cx="520" cy="340" r="7" fill="#6B4700"/>
<line x1="100" y1="100" x2="516" y2="100" stroke="#D85A30" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" marker-end="url(#arrow)"/>
<line x1="90" y1="170" x2="516" y2="180" stroke="#534AB7" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" marker-end="url(#arrow)"/>
<line x1="80" y1="240" x2="516" y2="260" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" marker-end="url(#arrow)"/>
<line x1="65" y1="305" x2="516" y2="340" stroke="#9A6400" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" marker-end="url(#arrow)"/>
<text x="340" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Every point on the same colored line shares one output &#8212; their exact position along that line is lost.</text>
</svg>
