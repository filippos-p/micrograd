<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>A full-rank map from R2 to R2 preserves distinctness, no collapsing</title>
<desc>Input space R2 with four distinct sample points; a full-rank linear map to output space R2 sends each to its own distinct point, with kernel equal to just the origin</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="180" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">input space (R&#178;) &#8212; samples x</text>
<rect x="60" y="40" width="240" height="340" fill="none" stroke="#888780" stroke-width="1"/>
<circle cx="110" cy="110" r="7" fill="#993C1D"/>
<circle cx="230" cy="130" r="7" fill="#26215C"/>
<circle cx="130" cy="280" r="7" fill="#04342C"/>
<circle cx="250" cy="320" r="7" fill="#6B4700"/>
<circle cx="180" cy="210" r="5" fill="#2C2C2A"/>
<text x="180" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">0 (kernel = {0} only)</text>
<text x="340" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2C2C2A">f</text>
<line x1="310" y1="215" x2="490" y2="215" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">output space (R&#178;)</text>
<rect x="420" y="40" width="200" height="340" fill="none" stroke="#888780" stroke-width="1"/>
<circle cx="450" cy="130" r="7" fill="#993C1D"/>
<circle cx="590" cy="90" r="7" fill="#26215C"/>
<circle cx="460" cy="320" r="7" fill="#04342C"/>
<circle cx="580" cy="360" r="7" fill="#6B4700"/>
<circle cx="520" cy="210" r="5" fill="#2C2C2A"/>
<line x1="110" y1="110" x2="446" y2="130" stroke="#993C1D" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
<line x1="230" y1="130" x2="586" y2="90" stroke="#26215C" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
<line x1="130" y1="280" x2="456" y2="320" stroke="#04342C" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
<line x1="250" y1="320" x2="576" y2="360" stroke="#6B4700" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
<text x="340" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Four distinct inputs land on four distinct outputs &#8212; nothing collapses, no information lost.</text>
</svg>
